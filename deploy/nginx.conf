server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    server_tokens off;
    charset utf-8;

    # compose 內部 DNS；避免 nginx 啟動時因解折不到名稱而掛掉
    resolver 127.0.0.11 valid=30s ipv6=off;

    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # 容器健康檢查用
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 檔名帶 hash 的產物：可以大膽長快取
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Service Worker 與註冊腳本：絕對不能快取，否則改版推不下去
    location ~ ^/(sw|workbox-[0-9a-f]+|registerSW)\.js$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        # location 層的 types 只影響這個區塊，不會動到全域 mime 表
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # 目前用 HashRouter，未知路徑不會進到伺服器；
    # 保留 fallback，之後改成 BrowserRouter 也不用再動 nginx。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
